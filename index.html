<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMOS — Where the light reaches your brain.</title>

    <!-- GOOGLE PROGRAMMABLE SEARCH -->
    <script async src="https://cse.google.com/cse.js?cx=c7f0e5fa2c39a4876"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background: #000;
            color: white;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================================
           LOADING SCREEN
           ========================================= */

        #intro {
            position: fixed;
            inset: 0;

            z-index: 99999;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    #DCA38C 0%,
                    #C4836D 35%,
                    #925645 68%,
                    #4D2921 100%
                );

            transition:
                opacity .8s ease,
                visibility .8s ease;
        }

        #intro.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-content {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-spline {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        .intro-spline iframe {
            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            border: none;
        }

        /*
           Covers the bottom-left Spline branding
        */

        .spline-cover {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 260px;
            height: 70px;

            background: #4D2921;

            z-index: 10;

            pointer-events: none;
        }

        .intro-logo {
            position: absolute;

            left: 50%;
            bottom: 12%;

            transform: translateX(-50%);

            z-index: 20;

            color: #fff;

            font-size: 45px;
            font-weight: 800;

            letter-spacing: -4px;

            text-shadow:
                0 2px 20px rgba(0,0,0,.4);
        }


        /* =========================================
           HOME
           ========================================= */

        .home-page {
            min-height: 100vh;

            display: grid;

            grid-template-columns:
                minmax(300px,.8fr)
                minmax(500px,1.3fr);

            align-items: center;

            gap: clamp(50px,8vw,130px);

            padding:
                50px
                clamp(40px,8vw,130px);
        }


        /* =========================================
           ORB
           ========================================= */

        .orb-area {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;
        }

        .hex-frame {
            width: min(400px,35vw);
            height: min(400px,35vw);

            min-width: 280px;
            min-height: 280px;

            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .orb-glow {
            position: absolute;

            width: 85%;
            height: 85%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.12),
                    transparent 70%
                );

            filter: blur(30px);
        }

        .orb {
            position: relative;

            width: 72%;
            height: 72%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #fff 0%,
                    #cfcfcf 12%,
                    #777 42%,
                    #252525 75%,
                    #050505 100%
                );

            box-shadow:
                inset -25px -30px 50px rgba(0,0,0,.8),
                inset 12px 12px 30px rgba(255,255,255,.25),
                0 0 80px rgba(255,255,255,.08);

            animation:
                orbFloat 5s ease-in-out infinite;
        }

        @keyframes orbFloat {

            0%, 100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-8px)
                    scale(1.015);
            }
        }


        /* =========================================
           CONTENT
           ========================================= */

        .content-side {
            width: 100%;
            max-width: 720px;
        }

        .home-logo {
            color: #fff;

            font-size:
                clamp(70px,9vw,130px);

            font-weight: 800;

            letter-spacing: -10px;

            line-height: .82;

            margin-bottom: 24px;
        }

        .home-tagline {
            color:
                rgba(255,255,255,.75);

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 8px;
        }

        .creator-credit {
            color:
                rgba(255,255,255,.45);

            font-size: 11px;

            margin-bottom: 35px;
        }


        /* =========================================
           SEARCH BOX
           ========================================= */

        .search-box {
            width: 100%;
            height: 66px;

            display: flex;

            align-items: center;

            padding:
                7px 7px 7px 22px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 40px;

            background:
                rgba(255,255,255,.025);

            transition:
                border-color .2s ease,
                background .2s ease;
        }

        .search-box:focus-within {
            border-color:
                rgba(255,255,255,.25);

            background:
                rgba(255,255,255,.04);
        }

        .search-symbol {
            color:
                rgba(255,255,255,.6);

            font-size: 18px;
        }

        #homeSearchInput {
            flex: 1;

            min-width: 0;

            border: 0;
            outline: 0;

            background: transparent;

            color: #fff;

            padding:
                0 12px;

            font-size: 15px;
        }

        #homeSearchInput::placeholder {
            color:
                rgba(255,255,255,.45);
        }

        .go-button {
            width: 52px;
            height: 52px;

            flex-shrink: 0;

            border: 0;

            border-radius: 50%;

            background: #fff;

            color: #000;

            font-size: 20px;

            transition:
                transform .2s ease;
        }

        .go-button:hover {
            transform:
                scale(1.05);
        }


        /* =========================================
           BUTTONS
           ========================================= */

        .home-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 15px;
        }

        .home-button {
            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 25px;

            padding:
                10px 18px;

            background: transparent;

            color:
                rgba(255,255,255,.6);

            font-size: 10px;

            letter-spacing: 1.3px;

            transition: .2s ease;
        }

        .home-button:hover {
            color: #fff;

            background:
                rgba(255,255,255,.06);

            border-color:
                rgba(255,255,255,.25);
        }


        /* =========================================
           RESULTS PAGE
           ========================================= */

        .results-page {
            display: none;

            width:
                min(1100px,calc(100% - 50px));

            margin:
                0 auto 100px;

            opacity: 0;

            transform:
                translateY(35px)
                scale(.985);

            filter: blur(8px);

            transition:
                opacity .7s ease,
                transform .7s ease,
                filter .7s ease;
        }

        .results-page.show {
            display: block;

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

            filter: blur(0);
        }

        .results-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 30px;
        }

        .results-label {
            color:
                rgba(255,255,255,.6);

            font-size: 10px;

            letter-spacing: 2px;
        }

        .back-button {
            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 20px;

            padding:
                8px 16px;

            background: transparent;

            color:
                rgba(255,255,255,.6);

            font-size: 10px;
        }

        .back-button:hover {
            color: #fff;

            background:
                rgba(255,255,255,.06);
        }


        /* =========================================
           GOOGLE SEARCH
           ========================================= */

        #googleResults {
            width: 100%;
        }

        .google-heading {
            color:
                rgba(255,255,255,.45);

            font-size: 10px;

            letter-spacing: 2px;

            margin-bottom: 20px;
        }

        /*
           Google search styling
        */

        .gsc-control-cse {
            width: 100% !important;

            padding: 0 !important;

            border: 0 !important;

            background: #000 !important;
        }

        .gsc-control-wrapper-cse {
            background: #000 !important;
        }

        .gsc-results {
            background: #000 !important;
        }

        .gsc-search-box,
        .gsc-search-box-tools {
            display: none !important;
        }

        .gsc-result {
            padding:
                22px 5px !important;

            border-bottom:
                1px solid
                rgba(255,255,255,.08) !important;

            background: #000 !important;
        }

        .gs-title,
        .gs-title b {
            color: #fff !important;

            font-size: 17px !important;
        }

        .gs-snippet {
            color:
                rgba(255,255,255,.65) !important;

            font-size: 14px !important;

            line-height: 1.7 !important;
        }

        .gs-visibleUrl {
            color:
                rgba(255,255,255,.40) !important;
        }

        .gsc-result-info {
            color:
                rgba(255,255,255,.40) !important;
        }

        .gsc-cursor-page {
            color:
                rgba(255,255,255,.65) !important;

            background: transparent !important;
        }

        .gsc-cursor-current-page {
            color: #fff !important;
        }


        /* =========================================
           SEARCH LOADING
           ========================================= */

        #searchLoading {
            display: none;

            margin:
                25px 0;

            color:
                rgba(255,255,255,.45);

            font-size: 12px;
        }

        #searchLoading.show {
            display: block;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 850px) {

            .home-page {
                min-height: auto;

                grid-template-columns: 1fr;

                gap: 35px;

                padding:
                    45px 22px 70px;

                text-align: center;
            }

            .orb-area {
                order: 1;
            }

            .content-side {
                order: 2;

                margin:
                    0 auto;
            }

            .home-logo {
                font-size: 70px;

                letter-spacing: -6px;
            }

            .home-buttons {
                justify-content: center;
            }

            .results-page {
                width:
                    calc(100% - 30px);
            }

            .intro-logo {
                font-size: 38px;

                bottom: 10%;
            }

            .spline-cover {
                width: 180px;
                height: 55px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         LOADING SCREEN
         ========================================= -->

    <div id="intro">

        <div class="intro-content">

            <div class="intro-spline">

                <iframe
                    src="https://my.spline.design/clonercubebinarycopy-ndlJwB79G42CZ6WCEUgtegHg/"
                    frameborder="0"
                    width="100%"
                    height="100%"
                    title="LUMOS Loading Animation"
                    allowfullscreen>
                </iframe>

            </div>


            <!-- Covers Spline branding -->

            <div class="spline-cover"></div>


            <div class="intro-logo">
                LUMOS
            </div>

        </div>

    </div>



    <!-- =========================================
         HOME
         ========================================= -->

    <main
        class="home-page"
        id="homePage">


        <div class="orb-area">

            <div class="hex-frame">

                <div class="orb-glow"></div>

                <div class="orb"></div>

            </div>

        </div>



        <div class="content-side">


            <div class="home-logo">
                LUMOS
            </div>


            <p class="home-tagline">
                Where the light reaches your brain.
            </p>


            <p class="creator-credit">
                Created by Aadvik Vivek
            </p>



            <!-- SEARCH -->

            <div class="search-box">


                <span class="search-symbol">
                    ◌
                </span>


                <input
                    type="text"
                    id="homeSearchInput"
                    placeholder="Ask anything..."
                    autocomplete="off"
                >


                <button
                    type="button"
                    class="go-button"
                    id="homeGoButton">

                    →

                </button>


            </div>



            <!-- BUTTONS -->

            <div class="home-buttons">


                <button
                    type="button"
                    class="home-button"
                    id="searchWebButton">

                    SEARCH

                </button>


                <button
                    type="button"
                    class="home-button"
                    id="wikipediaButton">

                    WIKIPEDIA

                </button>


                <button
                    type="button"
                    class="home-button"
                    id="randomButton">

                    RANDOM

                </button>


            </div>

        </div>

    </main>



    <!-- =========================================
         RESULTS
         ========================================= -->

    <section
        class="results-page"
        id="resultsPage">


        <div class="results-top">


            <div class="results-label">
                LUMOS / GOOGLE
            </div>


            <button
                type="button"
                class="back-button"
                id="backButton">

                ← LUMOS HOME

            </button>


        </div>



        <div
            id="searchLoading">

            Searching Google...

        </div>



        <div id="googleResults">


            <div class="google-heading">

                GOOGLE SEARCH RESULTS

            </div>


            <div
                class="gcse-searchresults-only"
                data-gname="lumosResults"
                data-autoSearchOnLoad="false"
                data-resultSetSize="10">

            </div>


        </div>


    </section>



    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>


        /* =========================================
           LOADING SCREEN
           1 SECOND
           ========================================= */

        window.addEventListener(
            "load",
            function() {

                setTimeout(
                    function() {

                        document
                            .getElementById("intro")
                            .classList
                            .add("hide");

                    },
                    1000
                );

            }
        );



        /* =========================================
           ELEMENTS
           ========================================= */

        const input =
            document.getElementById(
                "homeSearchInput"
            );


        const resultsPage =
            document.getElementById(
                "resultsPage"
            );


        const loading =
            document.getElementById(
                "searchLoading"
            );



        /* =========================================
           GOOGLE SEARCH
           ========================================= */

        function googleSearch(query) {


            query = query.trim();


            if (!query) {

                input.focus();

                return;

            }


            /*
               Show results page
            */

            resultsPage.classList.add(
                "show"
            );


            loading.classList.add(
                "show"
            );


            /*
               Scroll to results
            */

            setTimeout(
                function() {

                    resultsPage.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                },
                100
            );



            /*
               Wait for Google CSE
               to load
            */

            let attempts = 0;


            function executeSearch() {


                attempts++;


                if (
                    window.google &&
                    window.google.search &&
                    window.google.search.cse &&
                    window.google.search.cse.element
                ) {


                    try {


                        const element =
                            window.google
                                .search
                                .cse
                                .element
                                .getElement(
                                    "lumosResults"
                                );


                        if (element) {


                            element.execute(
                                query
                            );


                            loading.classList.remove(
                                "show"
                            );


                            return;

                        }


                    }
                    catch(error) {


                        console.error(
                            "Google Search Error:",
                            error
                        );

                    }

                }


                /*
                   Google isn't ready yet.
                   Try again.
                */

                if (attempts < 60) {


                    setTimeout(
                        executeSearch,
                        250
                    );


                }
                else {


                    loading.textContent =
                        "Google Search could not be loaded.";

                }

            }


            executeSearch();

        }



        /* =========================================
           GO BUTTON
           ========================================= */

        document
            .getElementById(
                "homeGoButton"
            )
            .addEventListener(
                "click",
                function() {

                    googleSearch(
                        input.value
                    );

                }
            );



        /* =========================================
           SEARCH BUTTON
           ========================================= */

        document
            .getElementById(
                "searchWebButton"
            )
            .addEventListener(
                "click",
                function() {

                    googleSearch(
                        input.value
                    );

                }
            );



        /* =========================================
           ENTER KEY
           ========================================= */

        input.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key === "Enter"
                ) {


                    event.preventDefault();


                    googleSearch(
                        input.value
                    );

                }

            }
        );



        /* =========================================
           WIKIPEDIA BUTTON
           ========================================= */

        document
            .getElementById(
                "wikipediaButton"
            )
            .addEventListener(
                "click",
                function() {


                    const query =
                        input.value.trim();


                    if (!query) {

                        input.focus();

                        return;

                    }


                    window.open(

                        "https://en.wikipedia.org/wiki/Special:Search?search=" +
                        encodeURIComponent(
                            query
                        ),

                        "_blank"

                    );

                }
            );



        /* =========================================
           RANDOM WIKIPEDIA
           ========================================= */

        document
            .getElementById(
                "randomButton"
            )
            .addEventListener(
                "click",
                function() {


                    window.open(

                        "https://en.wikipedia.org/wiki/Special:Random",

                        "_blank"

                    );

                }
            );



        /* =========================================
           BACK HOME
           ========================================= */

        document
            .getElementById(
                "backButton"
            )
            .addEventListener(
                "click",
                function() {


                    resultsPage.classList.remove(
                        "show"
                    );


                    window.scrollTo({

                        top: 0,

                        behavior: "smooth"

                    });

                }
            );

    </script>

</body>
</html>
