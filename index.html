<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LUMOS — Where the light reaches your brain.
    </title>


    <!-- Google Programmable Search -->
    <script
        async
        src="https://cse.google.com/cse.js?cx=c7f0e5fa2c39a4876">
    </script>


    <style>

        :root {

            --black: #000000;
            --white: #FFFFFF;

            --gray-90: rgba(255,255,255,.90);
            --gray-75: rgba(255,255,255,.75);
            --gray-60: rgba(255,255,255,.60);
            --gray-45: rgba(255,255,255,.45);
            --gray-25: rgba(255,255,255,.25);
            --gray-12: rgba(255,255,255,.12);

        }


        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

        }


        html {

            background: #000000;

            color: #FFFFFF;

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            background: #000000;

            color: #FFFFFF;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;

        }


        button,
        input {

            font-family: inherit;

        }


        button {

            cursor: pointer;

        }


        /* ==================================================
           INTRO
           ================================================== */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            background:

                radial-gradient(
                    circle at 50% 40%,
                    #DCA38C 0%,
                    #C4836D 35%,
                    #925645 68%,
                    #4D2921 100%
                );

            transition:

                opacity .8s ease,

                visibility .8s ease;

        }


        #intro.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        .intro-content {

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        .intro-orb {

            width: 125px;

            height: 125px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 30% 25%,
                    rgba(255,255,255,.25),
                    transparent 10%
                ),

                radial-gradient(
                    circle at 40% 35%,
                    #E0AA94,
                    #B9715A 45%,
                    #733F31 75%,
                    #2C1510 100%
                );

            box-shadow:

                inset -20px -25px 40px rgba(0,0,0,.5),

                inset 10px 10px 25px rgba(255,255,255,.12),

                0 0 65px rgba(255,220,205,.18);

            animation:
                introPulse 2.5s ease-in-out infinite;

        }


        .intro-logo {

            margin-top: 25px;

            color: #FFFFFF;

            font-size: 45px;

            font-weight: 800;

            letter-spacing: -4px;

        }


        @keyframes introPulse {

            0%,
            100% {

                transform: scale(.97);

            }

            50% {

                transform: scale(1.04);

            }

        }


        /* ==================================================
           HOME
           ================================================== */

        .home-page {

            min-height: 100vh;

            display: grid;

            grid-template-columns:
                minmax(300px,.8fr)
                minmax(500px,1.3fr);

            align-items: center;

            gap:
                clamp(50px,8vw,130px);

            padding:
                50px
                clamp(40px,8vw,130px);

        }


        .orb-area {

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* ==================================================
           HEXAGON ORB
           ================================================== */

        .hex-frame {

            position: relative;

            width:
                min(410px,36vw);

            aspect-ratio: 1;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .hex-frame::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                rgba(255,255,255,.12);

            clip-path:
                polygon(
                    25% 3%,
                    75% 3%,
                    97% 50%,
                    75% 97%,
                    25% 97%,
                    3% 50%
                );

        }


        .hex-frame::after {

            content: "";

            position: absolute;

            inset: 2px;

            background: #000000;

            clip-path:
                polygon(
                    25% 3%,
                    75% 3%,
                    97% 50%,
                    75% 97%,
                    25% 97%,
                    3% 50%
                );

        }


        .orb-glow {

            position: absolute;

            width: 75%;

            aspect-ratio: 1;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255,255,255,.10),
                    rgba(255,255,255,.025) 45%,
                    transparent 72%
                );

            filter: blur(25px);

            animation:
                glowPulse 6s ease-in-out infinite;

        }


        .orb {

            position: relative;

            z-index: 3;

            width: 59%;

            aspect-ratio: 1;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 30% 23%,
                    rgba(255,255,255,.30),
                    transparent 8%
                ),

                radial-gradient(
                    circle at 40% 35%,
                    #606060,
                    #353535 35%,
                    #161616 65%,
                    #030303 88%,
                    #000000 100%
                );

            box-shadow:

                inset -28px -30px 50px rgba(0,0,0,.95),

                inset 12px 12px 25px rgba(255,255,255,.08),

                0 0 60px rgba(255,255,255,.05);

            animation:
                orbFloat 7s ease-in-out infinite;

        }


        .orb::before {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,.08),
                    transparent 35%,
                    transparent 70%,
                    rgba(0,0,0,.55)
                );

        }


        .orb::after {

            content: "";

            position: absolute;

            width: 30%;

            height: 14%;

            top: 16%;

            left: 20%;

            border-radius: 50%;

            background:
                rgba(255,255,255,.13);

            filter: blur(8px);

            transform: rotate(-25deg);

        }


        @keyframes orbFloat {

            0%,
            100% {

                transform:
                    translateY(0)
                    scale(1);

            }

            50% {

                transform:
                    translateY(-8px)
                    scale(1.025);

            }

        }


        @keyframes glowPulse {

            0%,
            100% {

                opacity: .35;

                transform: scale(.96);

            }

            50% {

                opacity: .65;

                transform: scale(1.04);

            }

        }


        /* ==================================================
           HOME CONTENT
           ================================================== */

        .content-side {

            width: 100%;

            max-width: 720px;

        }


        .home-logo {

            color: #FFFFFF;

            font-size:
                clamp(70px,9vw,130px);

            font-weight: 800;

            letter-spacing: -10px;

            line-height: .82;

            margin-bottom: 24px;

        }


        .home-tagline {

            color: var(--gray-75);

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 8px;

        }


        .creator-credit {

            color: var(--gray-45);

            font-size: 11px;

            margin-bottom: 35px;

        }


        /* ==================================================
           SEARCH
           ================================================== */

        .search-box {

            width: 100%;

            height: 66px;

            display: flex;

            align-items: center;

            padding:
                7px 7px 7px 22px;

            border:
                1px solid
                var(--gray-12);

            border-radius: 40px;

            background:
                rgba(255,255,255,.025);

            transition:

                border-color .2s ease,

                background .2s ease;

        }


        .search-box:focus-within {

            border-color:
                var(--gray-25);

            background:
                rgba(255,255,255,.04);

        }


        .search-symbol {

            color: var(--gray-60);

            font-size: 18px;

        }


        #homeSearchInput {

            flex: 1;

            min-width: 0;

            border: 0;

            outline: 0;

            background: transparent;

            color: #FFFFFF;

            padding:
                0 12px;

            font-size: 15px;

        }


        #homeSearchInput::placeholder {

            color: var(--gray-45);

        }


        .go-button {

            width: 52px;

            height: 52px;

            flex-shrink: 0;

            border: 0;

            border-radius: 50%;

            background: #FFFFFF;

            color: #000000;

            font-size: 20px;

            transition:
                transform .2s ease;

        }


        .go-button:hover {

            transform: scale(1.05);

        }


        /* ==================================================
           BUTTONS
           ================================================== */

        .home-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 15px;

        }


        .home-button {

            border:
                1px solid
                var(--gray-12);

            border-radius: 25px;

            padding:
                10px 18px;

            background: transparent;

            color: var(--gray-60);

            font-size: 10px;

            letter-spacing: 1.3px;

            transition: .2s ease;

        }


        .home-button:hover {

            color: #FFFFFF;

            background:
                rgba(255,255,255,.06);

            border-color:
                var(--gray-25);

        }


        /* ==================================================
           RESULTS PAGE
           ================================================== */

        .results-page {

            display: none;

            width:
                min(1100px,calc(100% - 50px));

            margin:
                0 auto 100px;

            /*
             * Initial state for transition.
             */

            opacity: 0;

            transform:
                translateY(35px)
                scale(.985);

            filter: blur(8px);

            transition:

                opacity .7s
                    cubic-bezier(.22,1,.36,1),

                transform .7s
                    cubic-bezier(.22,1,.36,1),

                filter .7s
                    cubic-bezier(.22,1,.36,1);

        }


        .results-page.show {

            display: block;

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

            filter: blur(0);

        }


        /* ==================================================
           RESULTS TOP
           ================================================== */

        .results-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 30px;

        }


        .results-label {

            color: var(--gray-60);

            font-size: 10px;

            letter-spacing: 2px;

        }


        .back-button {

            border:
                1px solid
                var(--gray-12);

            border-radius: 20px;

            padding:
                8px 16px;

            background: transparent;

            color: var(--gray-60);

            font-size: 10px;

        }


        .back-button:hover {

            color: #FFFFFF;

            background:
                rgba(255,255,255,.06);

        }


        /* ==================================================
           ANSWER BOX
           ================================================== */

        .answer-box {

            display: none;

            margin-bottom: 40px;

            padding:
                38px 42px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 22px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                );

            box-shadow:
                0 20px 70px rgba(0,0,0,.35);

            /*
             * Answer transition.
             */

            opacity: 0;

            transform:
                translateY(30px)
                scale(.98);

            transition:

                opacity .7s
                    cubic-bezier(.22,1,.36,1),

                transform .7s
                    cubic-bezier(.22,1,.36,1);

        }


        .answer-box.show {

            display: block;

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

        }


        .answer-header {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 22px;

        }


        .answer-dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: #FFFFFF;

            box-shadow:
                0 0 14px
                rgba(255,255,255,.7);

        }


        .answer-label {

            color: #FFFFFF;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 1.7px;

            text-transform: uppercase;

        }


        .answer-source {

            margin-left: auto;

            color: var(--gray-45);

            font-size: 10px;

            letter-spacing: 1px;

        }


        .answer-title {

            color: #FFFFFF;

            font-size:
                clamp(30px,4vw,48px);

            line-height: 1.1;

            font-weight: 700;

            margin-bottom: 25px;

        }


        .answer-text {

            color: var(--gray-90);

            font-size:
                clamp(18px,2vw,23px);

            line-height: 1.75;

            max-width: 950px;

        }


        .answer-text p {

            margin-bottom: 20px;

        }


        .answer-text p:last-child {

            margin-bottom: 0;

        }


        .answer-link {

            display: inline-block;

            margin-top: 25px;

            color: #FFFFFF;

            font-size: 13px;

            text-decoration: none;

            border-bottom:
                1px solid
                var(--gray-45);

            padding-bottom: 3px;

        }


        .answer-link:hover {

            border-color: #FFFFFF;

        }


        /* ==================================================
           GOOGLE FALLBACK
           ================================================== */

        #googleFallback {

            display: none;

            opacity: 0;

            transform: translateY(25px);

            transition:

                opacity .6s ease,

                transform .6s
                    cubic-bezier(.22,1,.36,1);

        }


        #googleFallback.show {

            display: block;

            opacity: 1;

            transform: translateY(0);

        }


        .fallback-title {

            color: var(--gray-45);

            font-size: 10px;

            letter-spacing: 2px;

            margin-bottom: 20px;

        }


        .gsc-control-cse {

            width: 100% !important;

            padding: 0 !important;

            border: 0 !important;

            background: #000000 !important;

        }


        .gsc-control-wrapper-cse,
        .gsc-results {

            background: #000000 !important;

        }


        .gsc-search-box,
        .gsc-search-box-tools {

            display: none !important;

        }


        .gsc-result {

            padding:
                22px 5px !important;

            border-bottom:
                1px solid
                rgba(255,255,255,.08) !important;

            background: #000000 !important;

        }


        .gs-title,
        .gs-title b {

            color: #FFFFFF !important;

            font-size: 17px !important;

        }


        .gs-snippet {

            color:
                rgba(255,255,255,.65) !important;

            font-size: 14px !important;

            line-height: 1.7 !important;

        }


        .gs-visibleUrl {

            color:
                rgba(255,255,255,.40) !important;

        }


        .gsc-result-info {

            color:
                rgba(255,255,255,.40) !important;

        }


        .gsc-cursor-page {

            color:
                rgba(255,255,255,.65) !important;

            background: transparent !important;

        }


        /* ==================================================
           LOADING
           ================================================== */

        .loading {

            display: none;

            color: var(--gray-45);

            font-size: 12px;

            margin:
                25px 0;

        }


        .loading.show {

            display: block;

        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width:850px) {

            .home-page {

                min-height: auto;

                grid-template-columns: 1fr;

                gap: 35px;

                padding:
                    45px 22px 70px;

                text-align: center;

            }


            .orb-area {

                order: 1;

            }


            .content-side {

                order: 2;

                margin: 0 auto;

            }


            .hex-frame {

                width:
                    min(300px,70vw);

            }


            .home-logo {

                font-size: 70px;

                letter-spacing: -6px;

            }


            .home-buttons {

                justify-content: center;

            }


            .results-page {

                width:
                    calc(100% - 30px);

            }


            .answer-box {

                padding:
                    28px 24px;

            }


            .answer-text {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         INTRO
         ================================================== -->

        <div class="intro-content">

            <div class="intro-orb"></div>

    <!-- ==================================================
         HOME
         ================================================== -->

    <main

        <div class="orb-area">

                <div class="orb-glow"></div>

            </div>

            </p>

                </span>

                    id="homeSearchInput"

                >

                </button>

                </button>

                    class="home-button"

                </button>

                    type="button"
                    class="home-button"

                </button>

            </div>

    </main>


    <!-- ==================================================
         RESULTS
         ================================================== -->

    <section
        class="results-page"
        id="resultsPage"
    >


        <div class="results-top">

            <div class="results-label">
                LUMOS
            </div>


            <button
                type="button"
                class="back-button"
                id="backButton"
            >

            </button>

        <div

        <!-- ==================================================

        <div

                    data-gname="lumosResults"

    <script>


        /* ==================================================
           INTRO
           ================================================== */

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        document
                            .getElementById("intro")
                            .classList
                            .add("hide");

                    },
                    2500
                );

            }
        );


        /* ==================================================
           ELEMENTS
           ================================================== */

        const input =
            document.getElementById(
                "homeSearchInput"
            );


        const resultsPage =
            document.getElementById(
                "resultsPage"
            );


        const answerBox =
            document.getElementById(
                "answerBox"
            );


        const answerTitle =
            document.getElementById(
                "answerTitle"
            );


        const answerText =
            document.getElementById(
                "answerText"
            );


        const answerLink =
            document.getElementById(
                "answerLink"
            );


        const googleFallback =
            document.getElementById(
                "googleFallback"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        /* ==================================================
           CLEAR RESULTS
           ================================================== */

        function clearResults() {

            answerBox.classList.remove(
                "show"
            );


            googleFallback.classList.remove(
                "show"
            );


            answerTitle.textContent =
                "";


            answerText.innerHTML =
                "";


            answerLink.href =
                "";


            answerLink.style.display =
                "none";

        }


        /* ==================================================
           WIKIPEDIA
           ================================================== */

        async function getWikipediaAnswer(query) {

            const cleanQuery =
                query
                    .replace(
                        /^(who is|who was|what is|what are|what was|tell me about|define|explain)\s+/i,
                        ""
                    )
                    .trim();


            if (!cleanQuery) {

                return null;

            }


            try {

                const searchURL =

                    "https://en.wikipedia.org/w/api.php" +

                    "?action=query" +

                    "&list=search" +

                    "&srsearch=" +

                    encodeURIComponent(
                        cleanQuery
                    ) +

                    "&srlimit=5" +

                    "&format=json" +

                    "&origin=*";


                const response =
                    await fetch(
                        searchURL
                    );


                if (!response.ok) {

                    return null;

                }


                const data =
                    await response.json();


                const results =
                    data?.query?.search;


                if (
                    !results ||
                    results.length === 0
                ) {

                    return null;

                }


                const normalizedQuery =

                    cleanQuery
                        .toLowerCase()
                        .replace(
                            /[^\w\s]/g,
                            ""
                        )
                        .replace(
                            /\s+/g,
                            " "
                        )
                        .trim();


                let bestResult =
                    null;


                for (
                    const result of results
                ) {

                    const title =
                        result?.title;


                    if (!title) {

                        continue;

                    }


                    const normalizedTitle =

                        title
                            .toLowerCase()
                            .replace(
                                /[^\w\s]/g,
                                ""
                            )
                            .replace(
                                /\s+/g,
                                " "
                            )
                            .trim();


                    /*
                     * Exact match.
                     */

                    if (
                        normalizedTitle ===
                        normalizedQuery
                    ) {

                        bestResult =
                            result;

                        break;

                    }


                    /*
                     * Close title match.
                     */

                    if (
                        normalizedTitle.includes(
                            normalizedQuery
                        )
                    ) {

                        if (!bestResult) {

                            bestResult =
                                result;

                        }

                    }

                }


                /*
                 * Do not show unrelated results.
                 */

                if (!bestResult) {

                    return null;

                }


                const summaryURL =

                    "https://en.wikipedia.org/api/rest_v1/page/summary/" +

                    encodeURIComponent(
                        bestResult.title
                            .replace(
                                / /g,
                                "_"
                            )
                    );


                const summaryResponse =
                    await fetch(
                        summaryURL
                    );


                if (!summaryResponse.ok) {

                    return null;

                }


                const summary =
                    await summaryResponse.json();


                if (
                    !summary.extract ||
                    summary.extract.length < 80
                ) {

                    return null;

                }


                return {

                    title:
                        summary.title,

                    text:
                        summary.extract,

                    url:
                        summary
                            ?.content_urls
                            ?.desktop
                            ?.page ||
                        null

                };


            } catch (error) {

                console.error(
                    "Wikipedia error:",
                    error
                );

                return null;

            }

        }


        /* ==================================================
           FORMAT ANSWER
           ================================================== */

        function formatAnswerText(text) {

            const sentences =

                text.match(
                    /[^.!?]+[.!?]+/g
                ) || [text];


            const paragraphs = [];

            let current = "";


            sentences.forEach(
                function (
                    sentence,
                    index
                ) {

                    current +=
                        sentence.trim() +
                        " ";


                    if (
                        (index + 1) % 2 === 0
                    ) {

                        paragraphs.push(
                            current.trim()
                        );

                        current = "";

                    }

                }
            );


            if (
                current.trim()
            ) {

                paragraphs.push(
                    current.trim()
                );

            }


            answerText.innerHTML =
                "";


            paragraphs.forEach(
                function (
                    paragraph
                ) {

                    const p =
                        document.createElement(
                            "p"
                        );


                    p.textContent =
                        paragraph;


                    answerText.appendChild(
                        p
                    );

                }
            );

        }


        /* ==================================================
           SHOW ANSWER
           ================================================== */

        function showAnswer(answer) {

            /*
             * Hide Google.
             */

            googleFallback.classList.remove(
                "show"
            );


            answerTitle.textContent =
                answer.title;


            formatAnswerText(
                answer.text
            );


            document
                .getElementById(
                    "answerSource"
                )
                .textContent =
                    "WIKIPEDIA";


            if (answer.url) {

                answerLink.href =
                    answer.url;


                answerLink.style.display =
                    "inline-block";

            } else {

                answerLink.style.display =
                    "none";

            }


            /*
             * Trigger the answer animation.
             */

            requestAnimationFrame(
                function () {

                    requestAnimationFrame(
                        function () {

                            answerBox.classList.add(
                                "show"
                            );

                        }
                    );

                }
            );

        }


        /* ==================================================
           GOOGLE FALLBACK
           ================================================== */

        function showGoogleFallback(query) {

            answerBox.classList.remove(
                "show"
            );


            googleFallback.classList.add(
                "show"
            );


            let attempts = 0;


            function executeGoogle() {

                attempts++;


                if (
                    window.google &&
                    window.google.search &&
                    window.google.search.cse &&
                    window.google.search.cse.element
                ) {

                    try {

                        const element =

                            window.google
                                .search
                                .cse
                                .element
                                .getElement(
                                    "lumosResults"
                                );


                        if (element) {

                            element.execute(
                                query
                            );


                            loading.classList.remove(
                                "show"
                            );


                            setTimeout(
                                function () {

                                    googleFallback.scrollIntoView({
                                        behavior: "smooth",
                                        block: "center"
                                    });

                                },
                                150
                            );


                            return;

                        }

                    } catch (error) {

                        console.error(
                            "Google Search error:",
                            error
                        );

                    }

                }


                if (
                    attempts < 50
                ) {

                    setTimeout(
                        executeGoogle,
                        250
                    );

                } else {

                    loading.textContent =
                        "Web search could not be loaded.";

                }

            }


            executeGoogle();

        }


        /* ==================================================
           MAIN SEARCH
           ================================================== */

        async function runSearch() {

            const query =
                input.value.trim();


            if (!query) {

                input.focus();

                return;

            }


            /*
             * Remove the previous answer.
             */

            clearResults();


            /*
             * Show results page.
             */

            resultsPage.classList.add(
                "show"
            );


            /*
             * Let the transition begin.
             */

            await new Promise(
                function (resolve) {

                    setTimeout(
                        resolve,
                        250
                    );

                }
            );


            loading.textContent =
                "Finding the light...";


            loading.classList.add(
                "show"
            );


            /*
             * Move toward the answer area.
             */

            setTimeout(
                function () {

                    resultsPage.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                },
                50
            );


            /*
             * =========================================
             * WIKIPEDIA FIRST
             * =========================================
             */

            const wikipediaAnswer =
                await getWikipediaAnswer(
                    query
                );


            /*
             * =========================================
             * ANSWER FOUND
             * =========================================
             */

            if (
                wikipediaAnswer
            ) {

                /*
                 * Tiny pause for the reveal effect.
                 */

                await new Promise(
                    function (resolve) {

                        setTimeout(
                            resolve,
                            250
                        );

                    }
                );


                showAnswer({

                    title:
                        wikipediaAnswer.title,

                    text:
                        wikipediaAnswer.text,

                    url:
                        wikipediaAnswer.url,

                    source:
                        "WIKIPEDIA"

                });


                loading.classList.remove(
                    "show"
                );


                /*
                 * Scroll to the actual answer
                 * after its animation begins.
                 */

                setTimeout(
                    function () {

                        answerBox.scrollIntoView({
                            behavior: "smooth",
                            block: "center"
                        });

                    },
                    180
                );


                return;

            }


            /*
             * =========================================
             * NO WIKIPEDIA ANSWER
             *
             * Use Google as fallback.
             * =========================================
             */

            loading.classList.remove(
                "show"
            );


            showGoogleFallback(
                query
            );

        }


        /* ==================================================
           SEARCH BUTTON
           ================================================== */

        document
            .getElementById(
                "homeGoButton"
            )
            .addEventListener(
                "click",
                runSearch
            );


        document
            .getElementById(
                "searchWebButton"
            )
            .addEventListener(
                "click",
                runSearch
            );


        /* ==================================================
           ENTER
           ================================================== */

        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    runSearch();

                }

            }
        );


        /* ==================================================
           WIKIPEDIA BUTTON
           ================================================== */

        document
            .getElementById(
                "wikipediaButton"
            )
            .addEventListener(
                "click",
                function () {

                    const query =
                        input.value.trim();


                    if (!query) {

                        input.focus();

                        return;

                    }


                    window.open(

                        "https://en.wikipedia.org/wiki/Special:Search?search=" +

                        encodeURIComponent(
                            query
                        ),

                        "_blank"

                    );

                }
            );


        /* ==================================================
           RANDOM
           ================================================== */

        document
            .getElementById(
                "randomButton"
            )
            .addEventListener(
                "click",
                function () {

                    window.open(

                        "https://en.wikipedia.org/wiki/Special:Random",

                        "_blank"

                    );

                }
            );


        /* ==================================================
           BACK HOME
           ================================================== */

        document
            .getElementById(
                "backButton"
            )
            .addEventListener(
                "click",
                function () {

                    resultsPage.classList.remove(
                        "show"
                    );


                    clearResults();


                    window.scrollTo({

                        top: 0,

                        behavior: "smooth"

                    });

                }
            );

    </script>

</body>

</html>
